spring:
  application:
    name: ffl-monitor
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /ffl

ffl:
  poll-min-seconds: 60
  request-gap-millis: 3000
  backoff-seconds: 600
