server:
  address: 127.0.0.1

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/hnair_ffl}
    username: ${DB_USERNAME:ffl}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO
    com.ffl: INFO
