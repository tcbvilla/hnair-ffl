# 这台机器只启用这一份，监听 80。
# /school 是德州扑克，/ffl 是海航监控。根路径和其他路径返回 404。
# 德州扑克仓库里的 deploy/nginx-poker.conf 与此相同，不要同时放进 sites-enabled。
#
# 静态目录用符号链接对齐 URL：
#   sudo mkdir -p /opt/www
#   sudo ln -sfn /opt/poker/frontend/build /opt/www/school
#   sudo ln -sfn /opt/ffl/frontend/build /opt/www/ffl

server {
    listen 80 default_server;
    server_name 47.253.226.88;

    root /opt/www;

    location /school/api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /school {
        return 301 /school/;
    }

    location /school/ {
        try_files $uri $uri/ /school/index.html;
    }

    location /ffl/api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /ffl {
        return 301 /ffl/;
    }

    location /ffl/ {
        try_files $uri $uri/ /ffl/index.html;
    }

    location / {
        return 404;
    }
}
